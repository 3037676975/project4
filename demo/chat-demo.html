<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-CS Chat Demo</title>
<style>
body{margin:0;font-family:Arial,'Microsoft YaHei';background:linear-gradient(135deg,#0f172a,#2563eb);min-height:100vh;display:flex;align-items:center;justify-content:center}.box{width:420px;background:#fff;border-radius:24px;padding:24px;box-shadow:0 20px 50px #0004}.msg{background:#f1f5f9;padding:12px;border-radius:12px;margin:10px 0}.ai{background:#dbeafe}.input{display:flex;gap:10px}input{flex:1;padding:12px;border-radius:12px;border:1px solid #ddd}button{background:#2563eb;color:white;border:0;border-radius:12px;padding:12px 18px}</style>
</head>
<body><div class="box"><h2>🤖 AI-CS 智能客服 Demo</h2><div id="chat"><div class="msg ai">您好，我是AI客服，可以帮助您查询订单和知识库。</div></div><div class="input"><input id="q" placeholder="输入问题"><button onclick="send()">发送</button></div></div><script>function send(){let q=document.getElementById('q');let c=document.getElementById('chat');if(q.value){c.innerHTML+='<div class="msg">用户：'+q.value+'</div><div class="msg ai">AI：已收到您的问题，正在调用知识库分析。</div>';q.value='';}}</script></body></html>
