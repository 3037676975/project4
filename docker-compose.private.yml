services:
  knowflow:
    build:
      context: .
      dockerfile: Dockerfile.private
    environment:
      APP_ENV: local
      LOCAL_OCR_MODE: paddleocr
      LOCAL_AUTH_EMAIL: ${LOCAL_AUTH_EMAIL:-admin@local.test}
      LOCAL_AUTH_NAME: ${LOCAL_AUTH_NAME:-本地管理员}
      LOCAL_ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD:?run scripts/init-private first}
      LOCAL_AUTH_SESSION_SECRET: ${LOCAL_AUTH_SESSION_SECRET:?run scripts/init-private first}
      PLATFORM_ADMIN_EMAILS: ${LOCAL_AUTH_EMAIL:-admin@local.test}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:?run scripts/init-private first}
      PARSER_API_KEY: ${PARSER_API_KEY:?run scripts/init-private first}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SMTP_ENABLED: ${SMTP_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-smtp.qq.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-KnowFlow}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-true}
      SMTP_USE_STARTTLS: ${SMTP_USE_STARTTLS:-false}
      MAIL_RELAY_URL: http://email-relay:8025/send
      MAIL_RELAY_TOKEN: ${MAIL_RELAY_TOKEN:?run scripts/init-private first}
      EMAIL_CODE_EXPIRY_MINUTES: ${EMAIL_CODE_EXPIRY_MINUTES:-10}
      EMAIL_CODE_RESEND_SECONDS: ${EMAIL_CODE_RESEND_SECONDS:-60}
      EMAIL_CODE_MAX_ATTEMPTS: ${EMAIL_CODE_MAX_ATTEMPTS:-5}
      EMAIL_CODE_LENGTH: ${EMAIL_CODE_LENGTH:-6}
      APP_BASE_URL: http://186.244.245.177:28441
      PAYMENT_MODE: sandbox
      PAYMENT_CALLBACK_SECRET: ${PAYMENT_CALLBACK_SECRET:?run scripts/init-private first}
      OPERATIONS_SWEEP_SECRET: ${OPERATIONS_SWEEP_SECRET:?run scripts/init-private first}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:?run scripts/init-private first}
      QDRANT_COLLECTION: knowflow_chunks
      QDRANT_VECTOR_SIZE: "1024"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      qdrant:
        condition: service_healthy
      email-relay:
        condition: service_healthy
      paddleocr:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - knowflow-state:/app/.wrangler
      - ./.env.private:/app/.env.private:ro

  qdrant:
    image: qdrant/qdrant:v1.15.4
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?run scripts/init-private first}
    ports:
      - "127.0.0.1:6333:6333"
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 12

  paddleocr:
    build:
      context: ./services/paddleocr
    environment:
      OCR_API_KEY: ${PARSER_API_KEY:?run scripts/init-private first}
      OCR_MODEL_VERSION: ${OCR_MODEL_VERSION:-PP-OCRv6}
      OCR_DET_MODEL: ${OCR_DET_MODEL:-PP-OCRv6_small_det}
      OCR_REC_MODEL: ${OCR_REC_MODEL:-PP-OCRv6_small_rec}
      MAX_CONCURRENCY: "1"
      MAX_FILE_BYTES: "12582912"
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      PADDLE_PDX_MODEL_SOURCE: ${PADDLE_PDX_MODEL_SOURCE:-bos}
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    ports:
      - "127.0.0.1:8002:8002"
    restart: unless-stopped
    volumes:
      - paddleocr-cache:/root/.paddlex
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8002/health', headers={'Authorization':'Bearer '+os.environ['OCR_API_KEY']}); urllib.request.urlopen(r, timeout=8).read()\""]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s

  document-parser:
    profiles: ["parser"]
    build:
      context: ./services/document-parser
    environment:
      MAX_CONCURRENCY: "1"
      MAX_FILE_BYTES: "26214400"
      PARSE_TIMEOUT_SECONDS: "300"
      PARSER_API_KEY: ${PARSER_API_KEY:?run scripts/init-private first}
    ports:
      - "127.0.0.1:8001:8001"
    restart: unless-stopped
    volumes:
      - docling-cache:/root/.cache

  email-relay:
    build:
      context: ./services/email-relay
    environment:
      MAIL_RELAY_TOKEN: ${MAIL_RELAY_TOKEN:?run scripts/init-private first}
      SMTP_ALLOWED_HOSTS: ${SMTP_ALLOWED_HOSTS:-smtp.qq.com}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8025/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  operations-sweeper:
    image: curlimages/curl:8.15.0
    environment:
      OPERATIONS_SWEEP_SECRET: ${OPERATIONS_SWEEP_SECRET:?run scripts/init-private first}
    command: ["sh", "-c", "while true; do curl -fsS -X POST -H \"Authorization: Bearer $${OPERATIONS_SWEEP_SECRET}\" http://knowflow:3000/api/operations/sweep || true; sleep 60; done"]
    depends_on:
      - knowflow
    restart: unless-stopped

volumes:
  knowflow-state:
  qdrant-data:
  paddleocr-cache:
  docling-cache:
