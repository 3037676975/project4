name: Validate business checkout QR

on:
  push:
    branches:
      - checkout-qr-20260903
    paths:
      - .github/workflows/checkout-qr-refactor.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply checkout refactor
        run: python3 .github/scripts/checkout_qr_refactor.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Payment regression
        run: node --test tests/payment-crypto.test.mjs
      - name: Validate boundaries
        run: |
          git diff --check
          grep -Fq 'alipay.trade.precreate' lib/billing.ts
          grep -Fq 'PaymentCheckoutModal' app/dashboard.tsx
          grep -Fq '/api/payments/query?orderNo=' app/payment-checkout-modal.tsx
          grep -Fq 'window.setInterval(() => void query(true), 2500)' app/payment-checkout-modal.tsx
          if grep -Fq 'window.location.assign(data.order.paymentUrl)' app/dashboard.tsx; then exit 1; fi
      - name: Commit validated refactor
        run: |
          rm .github/workflows/checkout-qr-refactor.yml .github/scripts/checkout_qr_refactor.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(billing): add QR checkout and automatic payment sync'
          git push origin HEAD:checkout-qr-20260903
