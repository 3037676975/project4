name: Validate HTTP checkout compatibility

on:
  push:
    branches:
      - fix-http-checkout-uuid-20260903
    paths:
      - .github/workflows/fix-http-checkout-uuid.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply compatibility fix
        run: python3 .github/scripts/fix_http_checkout_uuid.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Validate checkout boundary
        run: |
          git diff --check
          grep -Fq 'clientRequestId: createClientRequestId()' app/dashboard.tsx
          if grep -Fq 'clientRequestId: crypto.randomUUID()' app/dashboard.tsx; then exit 1; fi
      - name: Commit validated fix
        run: |
          rm .github/workflows/fix-http-checkout-uuid.yml .github/scripts/fix_http_checkout_uuid.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(billing): support checkout on HTTP origins'
          git push origin HEAD:fix-http-checkout-uuid-20260903
