name: Apply reviewed Project4 server sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-project4-sync.yml'

permissions:
  contents: write

jobs:
  apply-reviewed-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test -f .sync/project4.patch.part00
          cat .sync/project4.patch.part* | base64 -d | gzip -d > /tmp/project4.patch
          echo '4ca8a8f8465e06aca239df96e0975227d1fae2dca8dae74723e6df689c8e8bd6  /tmp/project4.patch' | sha256sum -c -
          git apply --check /tmp/project4.patch
          git apply /tmp/project4.patch
          git diff --check
          if git ls-files | grep -E '(^|/)(\.env\.private|\.sites-runtime)(/|$)'; then
            echo 'Refusing to commit private runtime files.' >&2
            exit 1
          fi

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verify payment crypto
        run: node --experimental-strip-types --experimental-loader=./tests/cloudflare-loader.mjs --test tests/payment-crypto.test.mjs

      - name: Commit reviewed server sync
        shell: bash
        run: |
          set -euo pipefail
          rm -f .sync/project4.patch.part*
          rmdir .sync 2>/dev/null || true
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(platform): sync reviewed server fixes and low-resource Infinity'
          git push origin HEAD:main
